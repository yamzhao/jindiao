# Explicit real local startup; retain existing model route/budgets from the selected dotenv.
services:
  jindiao:
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER is required for real mode}
      MODEL_NAME: ${MODEL_NAME:?MODEL_NAME is required for real mode}
      MODEL_BASE_URL: ${MODEL_BASE_URL:?MODEL_BASE_URL is required for real mode}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required for real mode}
      TIANYANCHA_MCP_AUTHORIZATION: ${TIANYANCHA_MCP_AUTHORIZATION:?Tianyancha authorization is required}
      JINDIAO_AGENT_RUNTIME_MODE: formal
      JINDIAO_DATA_SOURCE_MODE: tianyancha
      JINDIAO_ALLOW_DEGRADED_MOCK: "false"
      JINDIAO_EXECUTION_PROFILE: attached
      JINDIAO_STORAGE_BACKEND: local
      JINDIAO_DETACHED_PROBE_PASSED: "false"
      JINDIAO_REPORTING_DEMO_ENABLED: "false"
