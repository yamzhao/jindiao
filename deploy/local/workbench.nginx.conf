# Local-only UI integration: ECS assets + the bin/local backend, without changing ECS.
server {
    listen 80;
    server_name localhost 127.0.0.1;
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Resolve again after a Compose backend recreation; stream SSE without buffering.
    location ~ ^/(api(?:/|$)|invocations(?:/|$)|ping$|docs(?:/|$)|openapi\.json$) {
        set $local_backend http://jindiao:8080;
        proxy_pass $local_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 900s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Jindiao-Debug-Backend local-8080 always;
    }

    # Only public static resources may reach ECS; never forward local credentials.
    location ~ ^/(assets/|favicon\.svg$|icons\.svg$) {
        limit_except GET HEAD { deny all; }
        proxy_pass http://1.95.121.114;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 1.95.121.114;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header X-Jindiao-Debug-Frontend ecs-static always;
    }

    # SPA navigation always loads the same HTML, without sending local Run IDs to ECS.
    location / {
        limit_except GET HEAD { deny all; }
        rewrite ^ /workbench? break;
        proxy_pass http://1.95.121.114;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host 1.95.121.114;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        add_header Cache-Control no-store always;
        add_header X-Jindiao-Debug-Frontend ecs-static always;
    }
}
