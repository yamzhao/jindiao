services:
  jindiao:
    build:
      context: .
    image: jindiao:local
    ports:
      - "${JINDIAO_BIND_HOST:-127.0.0.1}:${JINDIAO_PORT:-8080}:8080"
    env_file:
      - path: ${JINDIAO_ENV_FILE:-.env}
        required: false
    environment:
      JINDIAO_MOCK_DATA_ROOT: /app/mock_data
      JINDIAO_ARTIFACT_ROOT: /app/artifacts
      MODEL_NAME: ${MODEL_NAME:-deterministic-mock}
    volumes:
      - ${JINDIAO_ARTIFACT_MOUNT:-./artifacts}:/app/artifacts
    restart: unless-stopped

volumes:
  local-artifacts:
